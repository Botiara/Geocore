<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>GeoCore — Атлас и Справочник ОГЭ</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="data.js"></script>
  <script src="oge-guide.js"></script>
  <style>
    :root {
      --bg: #0b1116; --card: #131c24; --border: #22303c;
      --accent: #00e599; --blue: #38bdf8; --text: #f1f5f9; --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 12px; padding-bottom: 80px; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .sub { font-size: 11px; color: var(--accent); font-weight: 700; letter-spacing: 0.5px; }
    h1 { font-size: 20px; font-weight: 800; cursor: pointer; user-select: none; }
    .badge { background: var(--card); border: 1px solid var(--border); padding: 6px 12px; border-radius: 12px; text-align: center; }
    .badge span { display: block; font-size: 9px; color: var(--muted); }
    .badge b { color: var(--accent); font-size: 15px; }

    .tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; background: var(--card); padding: 4px; border-radius: 14px; border: 1px solid var(--border); margin-bottom: 10px; }
    .tab-btn { background: transparent; border: none; color: var(--muted); padding: 9px 4px; border-radius: 10px; font-size: 12px; font-weight: 700; cursor: pointer; transition: 0.2s; }
    .tab-btn.active { background: #1e2d3a; color: var(--accent); border: 1px solid rgba(0,229,153,0.3); }

    .layers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 8px; }
    .layer-btn { background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 7px; border-radius: 10px; font-size: 12px; font-weight: 600; cursor: pointer; }
    .layer-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(0,229,153,0.08); }

    .filters { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 8px; scrollbar-width: none; }
    .filters::-webkit-scrollbar { display: none; }
    .f-btn { background: var(--card); border: 1px solid var(--border); color: var(--muted); padding: 6px 11px; border-radius: 20px; font-size: 12px; white-space: nowrap; cursor: pointer; }
    .f-btn.active { background: var(--accent); color: #051b11; font-weight: 700; border-color: var(--accent); }

    #map { height: 52vh; min-height: 320px; border-radius: 16px; border: 1px solid var(--border); z-index: 1; }
    .info-card { margin-top: 10px; background: var(--card); border: 1px solid var(--border); border-left: 4px solid var(--accent); border-radius: 14px; padding: 14px; }
    .info-cat { font-size: 11px; color: var(--accent); font-weight: 700; text-transform: uppercase; margin-bottom: 4px; }
    .info-title { font-size: 18px; font-weight: 800; margin-bottom: 6px; }
    .info-desc { font-size: 13px; line-height: 1.45; color: #cbd5e1; }

    .hidden { display: none !important; }

    .search-box { width: 100%; background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 11px 14px; border-radius: 12px; font-size: 14px; margin-bottom: 10px; outline: none; }
    .search-box:focus { border-color: var(--accent); }
    .guide-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin-bottom: 10px; }
    .guide-cat { font-size: 11px; color: var(--blue); font-weight: 700; margin-bottom: 4px; }
    .guide-title { font-size: 15px; font-weight: 800; margin-bottom: 6px; color: #fff; }
    .guide-rule { font-size: 13px; line-height: 1.45; color: #cbd5e1; margin-bottom: 8px; }
    .guide-trap { font-size: 12px; line-height: 1.4; color: #fbbf24; background: rgba(251,191,36,0.08); border-left: 3px solid #fbbf24; padding: 7px 10px; border-radius: 6px; }

    .quiz-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; }
    .q-progress { font-size: 12px; color: var(--accent); font-weight: 700; margin-bottom: 8px; }
    .q-text { font-size: 16px; font-weight: 700; line-height: 1.4; margin-bottom: 14px; }
    .opt-btn { width: 100%; text-align: left; background: #18232d; border: 1px solid var(--border); color: var(--text); padding: 12px 14px; border-radius: 12px; font-size: 14px; margin-bottom: 8px; cursor: pointer; }
    .opt-btn.correct { background: rgba(0,229,153,0.18); border-color: var(--accent); color: var(--accent); font-weight: 700; }
    .opt-btn.wrong { background: rgba(239,68,68,0.18); border-color: #ef4444; color: #fca5a5; }
    .pro-box { margin-top: 14px; background: linear-gradient(135deg, #13222b, #0f172a); border: 1px solid rgba(56,189,248,0.4); border-radius: 14px; padding: 14px; text-align: center; }
    .pro-btn { margin-top: 10px; width: 100%; background: var(--accent); color: #041d13; border: none; padding: 12px; border-radius: 12px; font-size: 14px; font-weight: 800; cursor: pointer; }
  </style>
</head>
<body>

  <div class="header">
    <div>
      <div class="sub" id="subTitle">GEOCORE // АТЛАС И ОГЭ</div>
      <h1 id="mainTitle">География мира</h1>
    </div>
    <div class="badge"><span>ОЧКИ</span><b id="scoreVal">0</b></div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('map', this)">🌍 Карта (99)</button>
    <button class="tab-btn" onclick="switchTab('guide', this)">📚 Справочник</button>
    <button class="tab-btn" onclick="switchTab('quiz', this)">🎯 Тест ОГЭ</button>
  </div>

  <div id="tab-map">
    <div class="layers">
      <button class="layer-btn active" onclick="setLayer('street', this)">🗺️ Подробная</button>
      <button class="layer-btn" onclick="setLayer('dark', this)">🌑 Тёмная</button>
      <button class="layer-btn" onclick="setLayer('relief', this)">⛰️ Рельеф</button>
    </div>
    <div class="filters" id="filterBar"></div>
    <div id="map"></div>
    <div class="info-card" id="infoCard">
      <div class="info-cat" id="infoCat">ПОДСКАЗКА</div>
      <div class="info-title" id="infoTitle">Выбери объект на карте</div>
      <div class="info-desc" id="infoDesc">Нажми на любую светящуюся точку (город, океан или море), чтобы открыть справку для ОГЭ и заработать очки.</div>
    </div>
  </div>

  <div id="tab-guide" class="hidden">
    <input type="text" class="search-box" id="guideSearch" placeholder="🔍 Поиск по темам ОГЭ (азимут, циклон, тайга...)" oninput="renderGuide()" />
    <div id="guideList"></div>
  </div>

  <div id="tab-quiz" class="hidden">
    <div class="quiz-card" id="quizContainer"></div>
  </div>

  <script>
    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg) { tg.expand(); tg.ready(); }

    const BACKEND_URL = "https://ТВОЙ-СЕРВЕР.onrender.com";
    let score = Number(localStorage.getItem('gc_score') || 0);
    let isPro = localStorage.getItem('gc_pro') === '1';
    let taps = 0;

    document.getElementById('scoreVal').textContent = score;
    if (isPro) document.getElementById('subTitle').textContent = "GEOCORE // PRO АКТИВИРОВАН";

    document.getElementById('mainTitle').addEventListener('click', () => {
      taps++;
      if (taps >= 3) {
        isPro = true;
        localStorage.setItem('gc_pro', '1');
        document.getElementById('subTitle').textContent = "GEOCORE // ADMIN MODE";
        alert("Режим разработчика ADMIN активирован!");
      }
    });

    function addScore(pts) {
      score += pts;
      localStorage.setItem('gc_score', score);
      document.getElementById('scoreVal').textContent = score;
    }

    function switchTab(tab, btn) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      ['map', 'guide', 'quiz'].forEach(t => document.getElementById('tab-' + t).classList.add('hidden'));
      document.getElementById('tab-' + tab).classList.remove('hidden');
      if (tab === 'map') setTimeout(() => map.invalidateSize(), 100);
      if (tab === 'guide') renderGuide();
      if (tab === 'quiz') renderQuiz();
    }

    const map = L.map('map', { zoomControl: true }).setView([25, 30], 2);
    map.attributionControl.setPrefix('Leaflet');

    const tileLayers = {
      street: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', { attribution: 'Esri' }),
      dark: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', { attribution: 'Esri' }),
      relief: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/NatGeo_World_Map/MapServer/tile/{z}/{y}/{x}', { attribution: 'NatGeo' })
    };
    tileLayers.street.addTo(map);

    function setLayer(name, btn) {
      document.querySelectorAll('.layer-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      Object.values(tileLayers).forEach(l => map.removeLayer(l));
      tileLayers[name].addTo(map);
    }

    const allPlaces = typeof places !== 'undefined' ? places : [];
    const regions = ['Все', ...new Set(allPlaces.map(p => p.region))];
    let activeRegion = 'Все';
    const markersLayer = L.layerGroup().addTo(map);

    function renderFilters() {
      const bar = document.getElementById('filterBar');
      bar.innerHTML = regions.map(r => `<button class="f-btn ${r === activeRegion ? 'active' : ''}" onclick="setFilter('${r}')">${r}</button>`).join('');
    }

    function setFilter(reg) {
      activeRegion = reg;
      renderFilters();
      drawMarkers();
    }

    function drawMarkers() {
      markersLayer.clearLayers();
      const filtered = activeRegion === 'Все' ? allPlaces : allPlaces.filter(p => p.region === activeRegion);
      filtered.forEach(p => {
        const color = p.type === 'ocean' ? '#38bdf8' : (p.type === 'sea' ? '#22d3ee' : '#00e599');
        const m = L.circleMarker([p.lat, p.lng], {
          radius: p.type === 'ocean' ? 9 : 6,
          color: color, fillColor: color, fillOpacity: 0.45, weight: 2
        }).addTo(markersLayer);

        m.on('click', () => {
          document.getElementById('infoCat').textContent = `${p.region}`;
          document.getElementById('infoCat').style.color = color;
          document.getElementById('infoTitle').textContent = p.name;
          document.getElementById('infoDesc').textContent = p.desc;
          document.getElementById('infoCard').style.borderLeftColor = color;
          addScore(5);
        });
      });
    }

    renderFilters();
    drawMarkers();

    function renderGuide() {
      const list = document.getElementById('guideList');
      const q = (document.getElementById('guideSearch').value || '').toLowerCase().trim();
      const items = (typeof ogeGuide !== 'undefined' ? ogeGuide : []).filter(item =>
        !q || item.title.toLowerCase().includes(q) || item.rule.toLowerCase().includes(q) || item.cat.toLowerCase().includes(q)
      );
      list.innerHTML = items.map(i => `
        <div class="guide-card">
          <div class="guide-cat">${i.cat}</div>
          <div class="guide-title">${i.title}</div>
          <div class="guide-rule">${i.rule}</div>
          <div class="guide-trap">⚠️ ${i.trap}</div>
        </div>
      `).join('') || '<div class="guide-card">Ничего не найдено по запросу.</div>';
    }

    const quizData = typeof questions !== 'undefined' ? questions : [];
    let qIdx = 0, qScore = 0, answered = false;

    function renderQuiz() {
      const box = document.getElementById('quizContainer');
      if (!quizData.length) { box.innerHTML = 'Загрузка вопросов...'; return; }
      if (qIdx >= quizData.length) {
        box.innerHTML = `
          <div class="q-progress">ТЕСТ ЗАВЕРШЁН</div>
          <div class="q-text">Твой результат: ${qScore} из ${quizData.length}</div>
          <button class="opt-btn" style="text-align:center;font-weight:700" onclick="qIdx=0;qScore=0;renderQuiz()">🔄 Пройти заново</button>
          <div class="pro-box">
            <div style="font-weight:800;font-size:15px;color:#38bdf8">💎 GeoCore PRO (65 ⭐)</div>
            <div style="font-size:12px;color:#cbd5e1;margin-top:4px">Разблокировка закрытой базы задач №27–30 ОГЭ и эксклюзивных шпаргалок без ограничений.</div>
            <button class="pro-btn" onclick="buyPro()">Открыть PRO за 65 ⭐</button>
          </div>
        `;
        return;
      }
      answered = false;
      const cur = quizData[qIdx];
      box.innerHTML = `
        <div class="q-progress">ВОПРОС ${qIdx + 1} ИЗ ${quizData.length}</div>
        <div class="q-text">${cur.q}</div>
        ${cur.options.map((opt, idx) => `<button class="opt-btn" onclick="checkAns(${idx}, this)">${opt}</button>`).join('')}
      `;
    }

    function checkAns(idx, btn) {
      if (answered) return;
      answered = true;
      const cur = quizData[qIdx];
      const btns = document.querySelectorAll('.opt-btn');
      if (idx === cur.a) {
        btn.classList.add('correct');
        qScore++; addScore(10);
      } else {
        btn.classList.add('wrong');
        btns[cur.a].classList.add('correct');
      }
      setTimeout(() => { qIdx++; renderQuiz(); }, 1000);
    }

    async function buyPro() {
      try {
        const res = await fetch(`${BACKEND_URL}/create-invoice`, { method: 'POST' });
        const data = await res.json();
        if (data.invoice_url && tg) {
          tg.openInvoice(data.invoice_url, status => {
            if (status === 'paid') {
              isPro = true; localStorage.setItem('gc_pro', '1');
              alert('PRO-доступ успешно активирован!');
            }
          });
        } else { alert('Сервер оплаты ещё не запущен на хостинге.'); }
      } catch (e) { alert('Подключи bot.py на хостинг, чтобы активировать приём Stars.'); }
    }
  </script>
</body>
</html>
